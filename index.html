<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Hasyimi — Sedang Maintenance</title>
  <meta name="description" content="Website Ali Hasyimi sedang diperbarui. Segera kembali." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@500;700;800&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0A;
      --cream: #FFF3D6;
      --sand: #D4C6BD;
      --muted: #888888;
      --border: #222222;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, var(--bg) 75%);
      pointer-events: none;
    }
    main {
      position: relative;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .art { width: min(320px, 70vw); height: auto; margin: 0 auto 40px; display: block; }
    .draw { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 3s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .tag {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'Inter', sans-serif; font-weight: 500;
      font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--sand);
      border: 1px solid var(--border);
      padding: 8px 14px;
      margin-bottom: 24px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cream); animation: pulse 1.6s ease-in-out infinite; }
    h1 {
      font-family: 'Inter', sans-serif; font-weight: 800;
      font-size: clamp(32px, 7vw, 52px); line-height: 1.1;
      letter-spacing: -.02em; margin-bottom: 16px;
    }
    blockquote { margin-bottom: 36px; }
    h1 {
      font-family: 'Caveat', cursive; font-weight: 600;
      font-size: clamp(36px, 8vw, 56px); line-height: 1.15;
      letter-spacing: 0; margin-bottom: 12px;
    }
    cite { font-family: 'Caveat', cursive; font-style: normal; font-size: 24px; color: var(--sand); }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
      letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
      padding: 14px 24px; border: 1px solid var(--cream); color: var(--cream);
      transition: background .3s ease, color .3s ease;
    }
    .btn:hover, .btn:focus-visible { background: var(--cream); color: var(--bg); outline: none; }
    .btn.solid { background: var(--cream); color: var(--bg); }
    .btn.solid:hover, .btn.solid:focus-visible { background: transparent; color: var(--cream); }
    footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; stroke-dashoffset: 0; }
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="art" viewBox="0 0 320 220" fill="none" stroke="#FFF3D6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sketsa gunung">

      <g stroke="#D4C6BD">

      <!-- ridge lines -->

      <path d="M30 204c30-3 60 1 90-1M170 204c30 2 60-2 100 0" stroke="#D4C6BD" opacity=".5" />

        <path d="M92 40q6-8 12 0q6-8 12 0" />
        <path d="M70 62q4-6 8 0q4-6 8 0" opacity=".7" />
      </g>
    </svg>

    <div class="tag"><span class="dot"></span>Under Maintenance</div>
    <blockquote>

    <footer>&copy; Ali Hasyimi</footer>
  </main>
</body>
</html>
