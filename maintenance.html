<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Hasyimi — Sedang Maintenance</title>
  <meta name="description" content="Website Ali Hasyimi sedang diperbarui. Segera kembali." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0A;
      --cream: #FFF3D6;
      --sand: #D4C6BD;
      --muted: #888888;
      --border: #222222;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      background-position: center;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, var(--bg) 75%);
      pointer-events: none;
    }
    main {
      position: relative;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .art { width: min(320px, 70vw); height: auto; margin: 0 auto 40px; display: block; }
    .spin { transform-origin: 100px 100px; animation: spin 14s linear infinite; }
    .spin-rev { transform-origin: 215px 175px; animation: spin 9s linear infinite reverse; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse:nth-of-type(2n) { animation-delay: .8s; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .tag {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: 'Inter', sans-serif; font-weight: 500;
      font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--sand);
      border: 1px solid var(--border);
      padding: 8px 14px;
      margin-bottom: 24px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cream); animation: pulse 1.6s ease-in-out infinite; }
    h1 {
      font-family: 'Inter', sans-serif; font-weight: 800;
      font-size: clamp(32px, 7vw, 52px); line-height: 1.1;
      letter-spacing: -.02em; margin-bottom: 16px;
    }
    p { color: var(--sand); font-size: 16px; line-height: 1.7; margin-bottom: 36px; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px;
      letter-spacing: .08em; text-transform: uppercase; text-decoration: none;
      padding: 14px 24px; border: 1px solid var(--cream); color: var(--cream);
      transition: background .3s ease, color .3s ease;
    }
    .btn:hover, .btn:focus-visible { background: var(--cream); color: var(--bg); outline: none; }
    .btn.solid { background: var(--cream); color: var(--bg); }
    .btn.solid:hover, .btn.solid:focus-visible { background: transparent; color: var(--cream); }
    footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      .spin, .spin-rev, .pulse, .flow, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="art" viewBox="0 0 320 260" fill="none" stroke="#FFF3D6" stroke-width="1.5" role="img" aria-label="Ilustrasi roda gigi dan sirkuit">
      <!-- circuit traces -->
      <g stroke="#D4C6BD" opacity=".5">
        <path class="flow" d="M20 230 H90 V200" />
        <path class="flow" d="M300 40 H250 V70" />
        <path class="flow" d="M20 40 H60 V70" />
        <path class="flow" d="M300 230 H240 V210" />
      </g>
      <g fill="#FFF3D6" stroke="none">
        <circle class="pulse" cx="20" cy="230" r="4" />
        <circle class="pulse" cx="300" cy="40" r="4" />
        <circle class="pulse" cx="20" cy="40" r="4" />
        <circle class="pulse" cx="300" cy="230" r="4" />
      </g>
      <!-- large gear -->
      <g class="spin">
        <circle cx="100" cy="100" r="46" />
        <circle cx="100" cy="100" r="16" />
        <path d="M100 42v-14M100 158v14M42 100H28M158 100h14M59 59L49 49M141 141l10 10M141 59l10-10M59 141l-10 10" stroke-width="10" stroke-linecap="butt" />
      </g>
      <!-- small gear -->
      <g class="spin-rev">
        <circle cx="215" cy="175" r="30" />
        <circle cx="215" cy="175" r="10" />
        <path d="M215 140v-9M215 210v9M180 175h-9M250 175h9M190 150l-6-6M240 200l6 6M240 150l6-6M190 200l-6 6" stroke-width="8" />
      </g>
      <!-- code bracket chip -->
      <rect x="205" y="70" width="70" height="44" />
      <text x="240" y="98" fill="#FFF3D6" stroke="none" font-family="monospace" font-size="18" text-anchor="middle">&lt;/&gt;</text>
    </svg>

    <div class="tag"><span class="dot"></span>Under Maintenance</div>
    <h1>Lagi dirapikan,<br />segera kembali.</h1>
    <p>Website ini sedang diperbarui. Sambil menunggu, kamu bisa mengikuti kontennya di YouTube Niat Baik Studio atau menghubungi saya langsung.</p>

    <div class="links">
      <a class="btn solid" href="https://www.youtube.com/@niatbaikstudio" target="_blank" rel="noopener">Niat Baik Studio</a>
      <a class="btn" href="mailto:aliihasyimii@gmail.com">Email Saya</a>
    </div>

    <footer>&copy; Ali Hasyimi</footer>
  </main>
</body>
</html>
